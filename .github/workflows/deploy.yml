name: Deploy

# Manual promotion for now — trigger from the Actions tab.
# To auto-deploy on merge, add `push: { branches: [main] }` below once the
# required secrets exist. Required GitHub secrets:
#   RAILWAY_TOKEN               — project token, `railway tokens create` scoped to truthful-creativity
#   FIREBASE_SERVICE_ACCOUNT    — JSON service account with Hosting Admin on sonorous-crane-440603-s6
#   VITE_STRIPE_PUBLISHABLE_KEY — already used by CI
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        type: choice
        options:
          - all
          - backend
          - frontend

env:
  RAILWAY_PROJECT: truthful-creativity
  RAILWAY_SERVICE: crownmania-backend

jobs:
  backend:
    name: Deploy backend to Railway
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret is not configured — skipping deploy."
            exit 1
          fi
          railway up --service "$RAILWAY_SERVICE" --detach

      - name: Wait and verify health
        run: |
          sleep 60
          curl -fsS --retry 5 --retry-delay 15 https://api.crownmania.com/health

  frontend:
    name: Deploy frontend to Firebase Hosting
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write production env file
        working-directory: crownmania_frontend
        run: |
          cat > .env.production <<'EOF'
          VITE_API_URL=https://crownmania-backend-production.up.railway.app
          VITE_FIREBASE_API_KEY=AIzaSyCWUFvCqGeCTYPZ5RNTE5JRdg8044lay94
          VITE_FIREBASE_AUTH_DOMAIN=sonorous-crane-440603-s6.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=sonorous-crane-440603-s6
          VITE_FIREBASE_STORAGE_BUCKET=sonorous-crane-440603-s6.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=515434599532
          VITE_FIREBASE_APP_ID=1:515434599532:web:c803494515474ffa053449
          VITE_WEB3AUTH_CLIENT_ID=BAUmbZP04KfsjmqfinxmW1xx0GwYmetkTwMqSRA3UcIDBzWG5f_TZ4ozEdP5zrKucSUxuU4tY8YPnpFgNzMmdMw
          VITE_WEB3AUTH_NETWORK=sapphire_mainnet
          VITE_WEB3_CHAIN_ID=0x89
          VITE_WEB3_RPC_TARGET=https://polygon-bor-rpc.publicnode.com
          VITE_NFT_CONTRACT_ADDRESS=0x4785DBa85de01B0DB84269F3fd471dDd8461623C
          VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          EOF

      - name: Build
        run: npm run build -w crownmania_frontend

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not configured — skipping deploy."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools deploy --only hosting --project sonorous-crane-440603-s6
