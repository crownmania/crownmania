name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crownmania_backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: crownmania_backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint --if-present
      
      - name: Run unit tests
        run: npx jest --testPathPattern=tests/unit --passWithNoTests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
      
      - name: Run integration tests
        run: npx jest --testPathPattern=tests/integration --passWithNoTests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
      
      - name: Secret scanning
        run: |
          echo "Scanning for leaked secrets..."
          # Check for inline secrets in source code
          if grep -rE "(sk_live_|sk_test_|PRIVATE_KEY=)" --include="*.js" --include="*.ts" src/; then
            echo "ERROR: Potential secrets found in source code!"
            exit 1
          fi
          # Check for committed service account key files
          if find . -name "serviceAccountKey*" -not -path "*/node_modules/*" | grep -q .; then
            echo "ERROR: Service account key file found in repository!"
            find . -name "serviceAccountKey*" -not -path "*/node_modules/*"
            exit 1
          fi
          # Check for committed .env files (not .example)
          if find . -name ".env" -o -name ".env.local" -o -name ".env.production" | grep -v node_modules | grep -v ".env.example" | grep -q .; then
            echo "ERROR: .env file found in repository!"
            exit 1
          fi
          echo "No secrets found in source code"

  frontend:
    name: Frontend Build & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crownmania_frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: crownmania_frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Write production env file
        run: |
          cat > .env.production <<'EOF'
          VITE_API_URL=https://crownmania-backend-production.up.railway.app
          VITE_FIREBASE_API_KEY=AIzaSyCWUFvCqGeCTYPZ5RNTE5JRdg8044lay94
          VITE_FIREBASE_AUTH_DOMAIN=sonorous-crane-440603-s6.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=sonorous-crane-440603-s6
          VITE_FIREBASE_STORAGE_BUCKET=sonorous-crane-440603-s6.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=515434599532
          VITE_FIREBASE_APP_ID=1:515434599532:web:c803494515474ffa053449
          VITE_WEB3AUTH_CLIENT_ID=BAUmbZP04KfsjmqfinxmW1xx0GwYmetkTwMqSRA3UcIDBzWG5f_TZ4ozEdP5zrKucSUxuU4tY8YPnpFgNzMmdMw
          VITE_WEB3AUTH_NETWORK=sapphire_mainnet
          VITE_WEB3_CHAIN_ID=0x89
          VITE_WEB3_RPC_TARGET=https://polygon-bor-rpc.publicnode.com
          VITE_NFT_CONTRACT_ADDRESS=0x4785DBa85de01B0DB84269F3fd471dDd8461623C
          VITE_SITE_PASSWORD=cm1997
          VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          EOF
      
      - name: Build
        run: npm run build
      
      - name: Run linting
        run: npm run lint --if-present

  env-check:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check no .env files committed
        run: |
          echo "Checking for committed .env files..."
          ENV_FILES=$(find . -name ".env" -o -name ".env.local" -o -name ".env.production" | grep -v node_modules | grep -v ".env.example" || true)
          if [ -n "$ENV_FILES" ]; then
            echo "ERROR: .env files found in repository!"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "No .env files found (good!)"
      
      - name: Check .gitignore includes .env
        run: |
          if ! grep -q "^\.env$" .gitignore 2>/dev/null; then
            echo "WARNING: .env not in root .gitignore"
          fi
          echo "Gitignore check complete"
      
      - name: Dependency audit
        run: |
          cd crownmania_backend && npm audit --audit-level=high || echo "Backend audit complete"
          cd ../crownmania_frontend && npm audit --audit-level=high || echo "Frontend audit complete"

      - name: Check for hardcoded credentials
        run: |
          echo "Checking for hardcoded credentials..."
          # Check for hardcoded API keys, passwords, tokens
          if grep -rE "(apiKey|password|secret|token)\s*[:=]\s*['\"][^'\"]{10,}" \
            --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude="*.test.*" --exclude="*.example" \
            crownmania_backend/src/ crownmania_frontend/src/ 2>/dev/null | \
            grep -viE "(process\.env|import|require|mock|example|placeholder|your-)" ; then
            echo "WARNING: Potential hardcoded credentials detected (review above)"
          else
            echo "No hardcoded credentials found"
          fi
