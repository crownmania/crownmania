  <!-- Polyfills for Web3Auth -->
  <script>
    if (typeof global === 'undefined') { window.global = window; }
    if (typeof process === 'undefined') { window.process = { env: {}, versions: { node: '18.0.0' } }; }
    else if (!process.versions) { process.versions = { node: '18.0.0' }; }
    if (!process.nextTick) { process.nextTick = function (fn) { var args = Array.prototype.slice.call(arguments, 1); queueMicrotask(function () { fn.apply(null, args); }); }; }
    if (typeof Buffer === 'undefined') {
      window.Buffer = {
        isBuffer: function () { return false; },
        from: function (arr, enc) {
          if (typeof arr === 'string') {
            var u = new TextEncoder().encode(arr);
            u.slice = u.slice || Array.prototype.slice;
            return u;
          }
          var b = new Uint8Array(arr && arr.length ? arr : 0);
          b.slice = b.slice || Array.prototype.slice;
          return b;
        },
        alloc: function (size) {
          var b = new Uint8Array(size);
          b.slice = b.slice || Array.prototype.slice;
          return b;
        },
        allocUnsafe: function (size) { return new Uint8Array(size); },
        concat: function (list, len) {
          var total = len || list.reduce(function(s,b){ return s + b.length; }, 0);
          var result = new Uint8Array(total);
          var offset = 0;
          for (var i = 0; i < list.length; i++) {
            result.set(list[i], offset);
            offset += list[i].length;
          }
          return result;
        },
        byteLength: function (str) { return new TextEncoder().encode(str).length; }
      };
    }
  </script>
