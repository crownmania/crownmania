<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crownmania - Collectibles</title>
  <meta name="description"
    content="Revolutionary collectibles platform combining physical artistry with digital innovation" />

  <!-- Preload Designer font for faster loading -->
  <link rel="preload" href="/fonts/Designer.otf" as="font" type="font/otf" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Polyfills for Web3Auth -->
  <script>
    if (typeof global === 'undefined') { window.global = window; }
    if (typeof process === 'undefined') { window.process = { env: {}, versions: { node: '18.0.0' } }; }
    else if (!process.versions) { process.versions = { node: '18.0.0' }; }
    if (typeof Buffer === 'undefined') {
      window.Buffer = {
        isBuffer: function () { return false; },
        from: function (arr, enc) {
          if (typeof arr === 'string') {
            var u = new TextEncoder().encode(arr);
            u.slice = u.slice || Array.prototype.slice;
            return u;
          }
          var b = new Uint8Array(arr && arr.length ? arr : 0);
          b.slice = b.slice || Array.prototype.slice;
          return b;
        },
        alloc: function (size) {
          var b = new Uint8Array(size);
          b.slice = b.slice || Array.prototype.slice;
          return b;
        },
        allocUnsafe: function (size) { return new Uint8Array(size); },
        concat: function (list, len) {
          var total = len || list.reduce(function(s,b){ return s + b.length; }, 0);
          var result = new Uint8Array(total);
          var offset = 0;
          for (var i = 0; i < list.length; i++) {
            result.set(list[i], offset);
            offset += list[i].length;
          }
          return result;
        },
        byteLength: function (str) { return new TextEncoder().encode(str).length; }
      };
    }
  </script>

  <!-- Web3Auth v8 CDN - Modal and Provider -->
  <script src="https://cdn.jsdelivr.net/npm/@web3auth/ethereum-provider@8.12.4/dist/ethereumProvider.umd.min.js"
    defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@web3auth/modal@8.12.4/dist/modal.umd.min.js" defer></script>

  <!-- Designer Font (embedded as base64) -->
  <link rel="stylesheet" href="/fonts/designer-font.css" />

</head>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
